[project]
name = "tictactoe"
version = "0.1.0"
description = "Tic-Tac-Toe with RL support"
readme = "README.md"
authors = [
    { name = "Aleksandr Loktionov", email = "loktionov129@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "dearpygui>=2.3.1",
    "gymnasium>=1.3.0",
    "mypy>=2.3.1",
    "pylint>=4.0.9",
    "pytest>=8.0.0",
    "ruff>=0.16.9",
    "stable-baselines3>=2.9.0",
    "torch>=2.14.0",
]

[project.scripts]
tictactoe = "tictactoe.main:main"
check = "check:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Configuration for Ruff

[tool.ruff.lint]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["I001", "RUF059"]

[tool.mypy]
# Configuration for Mypy
[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
